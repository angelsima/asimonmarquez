<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script src="firebase-config.js"></script>
<title>Recursos</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: la misma mesa de papeles que la web, pero para guardar lo que encuentro. Dorado = mío, papel = de otros, torcido = por ver. */
:root{
  --paper:#F3F1EC; --paper-2:#E8E4DB; --card:#FFFFFF;
  --ink:#16161A; --ink-2:#4A4A50; --line:#16161A;
  --accent:#2340D9; --on-accent:#FFFFFF;
  --albero:#F2A33A; --on-albero:#16161A;
  --inv-bg:#16161A; --inv-fg:#F3F1EC; --inv-muted:#C9C5BC;
  --f-display:'Bricolage Grotesque', 'Arial Narrow', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131316; --paper-2:#1C1C21; --card:#202026;
    --ink:#ECE9E2; --ink-2:#A9A59C; --line:#CFCBC2;
    --accent:#8C9BFF; --on-accent:#0E0F1A;
    --albero:#F2A33A; --on-albero:#16161A;
    --inv-bg:#ECE9E2; --inv-fg:#16161A; --inv-muted:#4A4A50;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131316; --paper-2:#1C1C21; --card:#202026;
  --ink:#ECE9E2; --ink-2:#A9A59C; --line:#CFCBC2;
  --accent:#8C9BFF; --on-accent:#0E0F1A;
  --albero:#F2A33A; --on-albero:#16161A;
  --inv-bg:#ECE9E2; --inv-fg:#16161A; --inv-muted:#4A4A50;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-display);font-size:17px;line-height:1.5}
a{color:inherit}
a:hover{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
@media (min-width:700px){.wrap{padding-left:max(32px, env(safe-area-inset-left, 0px));padding-right:max(32px, env(safe-area-inset-right, 0px))}}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em}
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabecera */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:25;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 24px;padding-block:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;text-decoration:none;padding:10px 0;order:1}
.logo b{color:var(--accent);font-weight:800}
.nav-links{order:2;display:flex;flex-wrap:wrap;align-items:center;gap:0 22px;font-size:17px;font-weight:500}
.nav-links a{text-decoration:none;padding:12px 0}
.nav-links a[aria-current="page"]{font-weight:700;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:8px}
.nav-links a.pill{padding:9px 16px;border:1.5px solid var(--line);border-radius:999px}
.top-acts{order:3;display:flex;gap:8px;align-items:center}
.menu-btn{display:none;min-height:44px;padding:0 16px;border:1.5px solid var(--line);background:transparent;font-weight:600;border-radius:999px;cursor:pointer}
@media (max-width:1010px){
  .logo{order:1}.top-acts{order:2}.nav-links{order:3}
  .menu-btn{display:inline-flex;align-items:center}
  .nav-links{display:none;width:100%;flex-direction:column;align-items:flex-start;padding-bottom:12px}
  .nav-links.open{display:flex}
  .nav-links a.pill{margin-top:8px}
}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:16px;border:1.5px solid var(--ink);cursor:pointer}
.btn:hover{color:var(--paper);background:var(--accent);border-color:var(--accent)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:1.5px solid var(--line);text-decoration:none;font-weight:600;font-size:16px;background:transparent;color:var(--ink);cursor:pointer}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-accent:hover{color:var(--on-accent);background:var(--ink);border-color:var(--ink)}
.btn-sm{min-height:44px;padding:0 14px;font-size:15px}
.btn[disabled],.btn-ghost[disabled]{opacity:.4;cursor:default}

/* Portadas */
.hero{padding-block:48px 36px;display:flex;flex-wrap:wrap;gap:24px 64px;align-items:flex-end}
.hero > div{flex:1 1 480px;min-width:0}
.hero > .hero-side{flex:1 1 340px}
.display{font-size:clamp(40px, 6vw, 84px);line-height:.95;font-weight:750;letter-spacing:-.045em;margin-top:14px;overflow-wrap:anywhere}
.display-xl{font-size:clamp(46px, 7.4vw, 112px);line-height:.92;letter-spacing:-.05em}
.lede{font-size:20px;line-height:1.5;max-width:60ch}
.legend{margin-top:14px;font-family:var(--f-mono);font-size:13px;color:var(--ink-2);max-width:60ch}

.band{padding-block:0 64px}
.band-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 24px;border-top:1.5px solid var(--line);padding-top:18px;margin-bottom:28px}
.band-head h2{font-size:clamp(28px, 3.4vw, 40px);font-weight:700;letter-spacing:-.03em}

/* Marcador */
.score{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:8px}
@media (max-width:560px){.score{grid-template-columns:repeat(2, minmax(0, 1fr))}}
.tile{min-height:92px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:8px;padding:12px 14px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;text-align:left}
.tile b{font-size:44px;font-weight:750;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile span{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tile:hover{border-color:var(--accent)}
.tile.t-mio{background:var(--albero);color:var(--on-albero)}
.tile.t-ver{border-style:dashed}

/* Tarjetas de fijados */
.cards{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, 270px), 1fr));gap:28px;align-items:start}
.card{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);padding:18px;background:var(--card);color:var(--ink);transform:rotate(var(--tilt, 0deg));min-width:0}
.card.mio{background:var(--albero);color:var(--on-albero)}
.card.sinurl{border-style:dashed}
.card h3{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.08;overflow-wrap:anywhere}
.card h3 a{text-decoration:none}
.card .meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.card p.nota{font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.card.mio .btn-ghost{border-color:var(--on-albero);color:var(--on-albero)}

/* Puertas a las disciplinas */
.doors{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--line)}
.doors li{border-bottom:1.5px solid var(--line)}
.doors a{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 32px;padding-block:20px;text-decoration:none}
.doors .name{flex:1 1 280px;font-size:clamp(34px, 4.4vw, 58px);font-weight:700;letter-spacing:-.035em;line-height:1}
.doors .what{flex:1 1 340px;font-size:17px;line-height:1.4;color:var(--ink-2)}
.doors .count{flex:0 0 130px;font-family:var(--f-mono);font-size:13px;color:var(--accent);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:700px){.doors .count{text-align:left;flex-basis:100%}}

/* Buscador y filtros */
.arch-tools{display:flex;flex-direction:column;gap:14px;border:1.5px solid var(--line);background:var(--card);padding:18px;margin-bottom:32px}
.arch-q{width:100%;min-height:52px;padding:0 16px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fgroup > span{flex:0 0 100px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
@media (max-width:520px){.fgroup > span{flex-basis:100%}}
.fbtn{min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:transparent;font-weight:500;font-size:16px;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.fsel{min-height:44px;padding:0 12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;max-width:100%}
.arch-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 24px;border-top:1.5px dashed var(--line);padding-top:12px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* Lista */
.arch-year{font-size:26px;font-weight:700;letter-spacing:-.02em;padding-block:26px 8px}
.arow{display:grid;grid-template-columns:88px minmax(0, 1fr);gap:16px;align-items:start;padding-block:16px;border-bottom:1.5px solid var(--line)}
.arch-year + .arow,.arow:first-child{border-top:1.5px solid var(--line)}
@media (max-width:520px){.arow{grid-template-columns:64px minmax(0, 1fr);gap:12px}}
.athumb{aspect-ratio:1/1;border:1.5px solid var(--line);transform:rotate(var(--tilt, 0deg));display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.athumb{overflow:hidden}
.athumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:1.5px solid currentColor}
.photo{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.photo-prev{width:140px;aspect-ratio:1/1;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card)}
.photo-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-btns{display:flex;flex-wrap:wrap;gap:8px}
#i-foto:focus-visible + label{outline:3px solid var(--accent);outline-offset:3px}
dialog.drop{outline:3px dashed var(--accent);outline-offset:-8px}
.tone-paper{background:var(--paper-2);color:var(--ink)}
.tone-albero{background:var(--albero);color:var(--on-albero)}
.athumb.is-idea{border-style:dashed;background:transparent;color:var(--ink)}
.arow h3{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.15;overflow-wrap:anywhere}
.arow h3 a{text-decoration:none}
.arow h3 a:hover{color:var(--accent)}
.arow.visto h3{color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border:1.5px solid currentColor;line-height:1.4}
.chip-dash{border-style:dashed}
.chip-mio{background:var(--albero);color:var(--on-albero);border-color:var(--line)}
.chip-fij{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sub{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);margin-top:6px;overflow-wrap:anywhere}
.nota{margin-top:8px;max-width:68ch;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.row-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.empty{font-size:19px;color:var(--ink-2);padding-block:24px;max-width:60ch}
.empty .btn,.empty .btn-ghost{margin-top:14px;margin-right:8px}

/* Diálogos */
dialog{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);padding:0;width:min(600px, calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.field > legend,legend.lbl{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding:0}
.field input[type=text],.field textarea,.field select{min-height:48px;padding:10px 12px;border:1.5px solid var(--line);background:var(--card);width:100%;font-size:17px}
.field textarea{min-height:96px;resize:vertical}
fieldset{border:0;margin:0;padding:0;min-width:0}
.pickers{display:flex;flex-wrap:wrap;gap:8px}
.pk{position:relative}
.pk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pk span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;font-weight:500;font-size:16px}
.pk input:checked + span{background:var(--ink);color:var(--paper);font-weight:600}
.pk input:focus-visible + span{outline:3px solid var(--accent);outline-offset:3px}
.dlg-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1.5px dashed var(--line);padding-top:14px}
.dlg-acts div{display:flex;flex-wrap:wrap;gap:8px}
.err{background:var(--albero);color:var(--on-albero);padding:8px 12px;font-weight:600}
.json{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12.5px;padding:10px;border:1.5px solid var(--line);background:var(--card)}

/* Pie */
.foot{background:var(--inv-bg);color:var(--inv-fg)}
.foot-in{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px 48px;padding-block:44px 36px}
.foot .logo{font-size:24px;padding:0}
.foot .logo b{color:var(--albero)}
.foot .btn-ghost{border-color:var(--inv-fg);color:var(--inv-fg)}
.foot .btn-ghost:hover{color:var(--albero);border-color:var(--albero)}
.foot p{color:var(--inv-muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--paper);padding:12px 18px;font-weight:600;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast button{min-height:36px;padding:0 12px;border:1.5px solid currentColor;background:transparent;color:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

.field input[type=email],.field input[type=password]{min-height:48px;padding:10px 12px;border:1.5px solid var(--line);background:var(--card);width:100%;font-size:17px}
.dlg-acts.login{justify-content:flex-end}
#foot-note .btn-ghost{margin-left:8px}
</style>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="#inicio">ángel<b>·</b>recursos</a>
    <div class="top-acts">
      <button class="btn btn-accent" type="button" id="add-btn">+ Guardar</button>
      <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links">Menú</button>
    </div>
    <nav class="nav-links" id="nav-links" aria-label="Principal"></nav>
  </div>
</header>

<main id="main"></main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <p class="logo" style="color:var(--inv-fg)">ángel<b>·</b>recursos</p>
      <p style="margin-top:8px" id="foot-note">Solo para mí.</p>
    </div>
    <div>
      <button class="btn-ghost" type="button" id="backup-btn">Copia de seguridad</button>
    </div>
  </div>
</footer>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="login-dlg" aria-labelledby="login-title"></dialog>
<div id="toast-root" aria-live="polite"></div>

<script>
/* ===== Las disciplinas: las mismas de la web, más Idiomas y Apps ===== */
const DISC = {
  escritura:{label:'Escritura', what:'Lecturas, técnicas, referentes y textos que me sirven para escribir.'},
  juegos:{label:'Juegos', what:'Mecánicas, motores, juegos de otros y lo que me enseña a diseñar.'},
  musica:{label:'Música', what:'Canciones, acordes, partituras, ritmos y vídeos para tocar.'},
  taller:{label:'Taller', what:'Dibujo, objetos, materiales y cosas para hacer con las manos.'},
  tierra:{label:'Tierra', what:'Permacultura, plantas, huerto y diseño del lugar.'},
  idiomas:{label:'Idiomas', what:'Material para enseñar y aprender español y otras lenguas.'},
  apps:{label:'Apps y web', what:'Herramientas, código, trucos y servicios para construir cosas.'}
};
const TIPOS = {articulo:['Artículo','ART'], video:['Vídeo','VID'], audio:['Audio','AUD'], herramienta:['Herramienta','HER'], libro:['Libro','LIB'], imagen:['Imagen','IMG'], apunte:['Apunte','NOT'], otro:['Otro','OTR']};
const DKEYS = Object.keys(DISC);

/* ===== Utilidades ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const today = () => new Date().toLocaleDateString('sv-SE');
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const $ = s => document.querySelector(s);
function cleanUrl(u){
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; }
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
function clean(r){
  if (!r || typeof r !== 'object') return null;
  const url = cleanUrl(r.url);
  let t = String(r.t || '').trim().slice(0, 200);
  if (!t && url) t = hostOf(url);
  if (!t) return null;
  return {
    id: typeof r.id === 'string' && r.id.replace(/[^A-Za-z0-9_-]/g, '_') ? r.id.replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 40) : uid(),
    t, url,
    nota: String(r.nota || '').trim().slice(0, 2000),
    origen: r.origen === 'mio' ? 'mio' : 'otros',
    autor: String(r.autor || '').trim().slice(0, 80),
    disc: (Array.isArray(r.disc) ? r.disc : []).filter(d => DKEYS.includes(d)),
    tipo: TIPOS[r.tipo] ? r.tipo : (url ? 'articulo' : 'apunte'),
    tags: (Array.isArray(r.tags) ? r.tags : []).map(x => String(x).trim().slice(0, 30)).filter(Boolean).slice(0, 12),
    estado: r.estado === 'visto' ? 'visto' : 'por ver',
    fijado: !!r.fijado,
    img: typeof r.img === 'string' && r.img.length < 400000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(r.img) ? r.img : '',
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(r.fecha) ? r.fecha : today(),
    mod: Number(r.mod) || Date.now()
  };
}

/* ===== Datos: base de datos del artefacto si existe, si no este navegador ===== */
const LS = 'recursos-v1';
let items = [];
let readOnly = false;
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify({items})); }
  catch (e) { try { localStorage.setItem(LS, JSON.stringify({items: items.map(i => Object.assign({}, i, {img: ''}))})); } catch (e2) {} }
}
try { const raw = JSON.parse(localStorage.getItem(LS) || 'null'); if (raw && Array.isArray(raw.items)) items = raw.items.map(clean).filter(Boolean); } catch (e) {}


/* ===== Firebase (proyecto «mis-cosas»): sesión por correo y Firestore ===== */
const Cloud = (() => {
  const cfg = window.MIS_COSAS_FIREBASE || {};
  const has = !!(cfg.apiKey && cfg.projectId);
  const st = {estado: has ? 'cargando' : 'sin-config', user: null, fs: null, error: ''};
  const subs = [];
  const emit = () => subs.forEach(f => { try { f(st); } catch (e) { console.error(e); } });
  const load = src => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('No carga ' + src)); document.head.appendChild(s); });
  async function start(){
    if (!has){ emit(); return; }
    try {
      const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
      await load(B + 'firebase-app-compat.js');
      await Promise.all([load(B + 'firebase-auth-compat.js'), load(B + 'firebase-firestore-compat.js')]);
      firebase.initializeApp(cfg);
      st.fs = firebase.firestore();
      try { await st.fs.enablePersistence({synchronizeTabs: true}); } catch (e) {}
      firebase.auth().onAuthStateChanged(u => { st.user = u || null; st.estado = u ? 'conectado' : 'sin-sesion'; st.error = ''; emit(); });
    } catch (e) { st.estado = 'sin-red'; emit(); }
  }
  const mine = () => st.fs.collection('users').doc(st.user.uid);
  return {st, start, onChange: f => { subs.push(f); }, emit,
    signIn: (m, p) => firebase.auth().signInWithEmailAndPassword(m, p),
    signOut: () => firebase.auth().signOut(),
    col: n => mine().collection(n),
    doc: (c, d) => mine().collection(c).doc(d),
    del: () => firebase.firestore.FieldValue.delete()};
})();
function syncLine(){

  else if (s.estado === 'conectado'){ msg = 'Sincronizado con tu cuenta (' + esc(s.user.email || 'sin correo') + '). Lo ves igual en cualquier dispositivo.'; btn = 'out'; }
  else if (s.estado === 'sin-sesion'){ msg = 'Sin iniciar sesión: se guarda solo en este navegador.'; btn = 'in'; }
  else if (s.estado === 'cargando') msg = 'Conectando con Firebase…';

let colRef = null, unsub = null, known = new Map(), attachedUid = undefined;
function noteSave(){
  $('#foot-note').innerHTML = syncLine();
}
function fail(err){
  Cloud.st.error = err && err.code === 'permission-denied' ? 'permiso' : 'guardar';
  noteSave(); toast('No se ha podido guardar en Firebase.');
}
function persist(){
  saveLocal();
  if (!colRef) return;
  const now = new Map(items.map(i => [i.id, JSON.stringify(i)]));
  const ops = [];
  now.forEach((j, id) => { if (known.get(id) !== j) ops.push(['set', id]); });
  known.forEach((_, id) => { if (!now.has(id)) ops.push(['del', id]); });
  if (!ops.length) return;
  known = now;
  const byId = new Map(items.map(i => [i.id, i]));
  for (let k = 0; k < ops.length; k += 400){
    const b = Cloud.st.fs.batch();
    ops.slice(k, k + 400).forEach(([op, id]) => { if (op === 'set') b.set(colRef.doc(id), byId.get(id)); else b.delete(colRef.doc(id)); });
    b.commit().catch(fail);
  }
}
function attach(){
  const uid = Cloud.st.user ? Cloud.st.user.uid : null;
  if (attachedUid === uid) return; attachedUid = uid;
  if (unsub){ unsub(); unsub = null; } colRef = null; known = new Map();
  if (!uid) return;
  colRef = Cloud.col('recursos');
  unsub = colRef.onSnapshot(snap => {
    Cloud.st.error = '';
    const remote = snap.docs.map(d => clean(Object.assign({}, d.data(), {id: d.id}))).filter(Boolean);
    known = new Map(remote.map(i => [i.id, JSON.stringify(i)]));
    if (!wasMigrated('recursos')){
      const ids = new Set(remote.map(i => i.id));
      items = [...remote, ...items.filter(i => !ids.has(i.id))];
      markMigrated('recursos'); persist();
    } else items = remote;
    saveLocal();
    noteSave(); refresh();
  }, () => { Cloud.st.error = 'permiso'; noteSave(); });
}
function onSignedOut(){ items = []; try { localStorage.removeItem(LS); } catch (e) {} refresh(); }

let editId = null, formImg = '';
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ko; im.src = url; });
    const k = Math.min(1, 480 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    for (const q of [0.74, 0.6, 0.5]){ const d = c.toDataURL('image/jpeg', q); if (d.length < 150000) return d; }
    return c.toDataURL('image/jpeg', 0.4);
  } finally { URL.revokeObjectURL(url); }
}

    <div class="field"><label for="i-url">Enlace (opcional)</label><input type="text" id="i-url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…" value="${esc(d.url)}"></div>
    <div class="field"><label for="i-t">Título</label><input type="text" id="i-t" autocomplete="off" maxlength="200" placeholder="Si lo dejas vacío uso el nombre de la web" value="${esc(d.t)}"></div>
    <div class="field"><span class="lbl" style="font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)">Foto (opcional)</span>
      <div class="photo"><div class="photo-prev" id="ph-prev"></div>
        <div class="photo-btns"><input type="file" id="i-foto" class="sr-only" accept="image/*"><label for="i-foto" class="btn-ghost btn-sm" style="cursor:pointer">Elegir o hacer foto</label><button type="button" class="btn-ghost btn-sm" id="ph-del">Quitar foto</button></div></div>
      <p class="mono muted" style="font-size:12px">También puedes pegar una imagen (Ctrl+V) o arrastrarla aquí.</p></div>
    <div class="field"><label for="i-nota">Nota</label><textarea id="i-nota" maxlength="2000" placeholder="Por qué lo guardo, qué dice, qué quiero hacer con ello">${esc(d.nota)}</textarea></div>
    <fieldset class="field"><legend class="lbl">Disciplinas</legend><div class="pickers">${DKEYS.map(k => `<label class="pk"><input type="checkbox" name="disc" value="${k}" ${d.disc.includes(k) ? 'checked' : ''}><span>${DISC[k].label}</span></label>`).join('')}</div></fieldset>
    <fieldset class="field"><legend class="lbl">Origen</legend><div class="pickers">
      <label class="pk"><input type="radio" name="origen" value="otros" ${d.origen === 'otros' ? 'checked' : ''}><span>De otros</span></label>
      <label class="pk"><input type="radio" name="origen" value="mio" ${d.origen === 'mio' ? 'checked' : ''}><span>Mío</span></label></div></fieldset>
    <div class="field"><label for="i-autor">Autor o fuente (opcional)</label><input type="text" id="i-autor" autocomplete="off" maxlength="80" value="${esc(d.autor)}"></div>
    <div class="field"><label for="i-tipo">Tipo</label><select id="i-tipo"><option value="">Automático (artículo si tiene enlace, apunte si no)</option>${Object.entries(TIPOS).map(([k, v]) => `<option value="${k}" ${d.tipo === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
    <div class="field"><label for="i-tags">Etiquetas, separadas por comas</label><input type="text" id="i-tags" autocomplete="off" placeholder="acordes, humor, referencia" value="${esc(d.tags.join(', '))}"></div>
    <label class="check" for="i-visto"><input type="checkbox" id="i-visto" ${d.estado === 'visto' ? 'checked' : ''}> Ya lo he visto</label>
    <label class="check" for="i-fijado"><input type="checkbox" id="i-fijado" ${d.fijado ? 'checked' : ''}> Fijar en la portada</label>
    <p class="err" id="i-err" role="alert" hidden></p>
    <div class="dlg-acts"><div>${old ? '<button type="button" class="btn-ghost" id="i-del">Borrar</button>' : ''}</div>
      <div><button type="button" class="btn-ghost" data-dclose>Cancelar</button><button type="submit" class="btn btn-accent">Guardar</button></div></div>
  </form>`;
  formImg = old ? old.img : '';
  renderPhoto();
  if (!dlg.open) dlg.showModal();
  const u = $('#i-url'); if (u && !old) u.focus();
}
function saveForm(){
  const url = $('#i-url').value.trim();
  const err = $('#i-err');
  const show = m => { err.textContent = m; err.hidden = false; };
  if (url && !cleanUrl(url)) return show('El enlace no parece válido. Debe empezar por http:// o https://, o ser una dirección como ejemplo.com.');
  const old = editId ? items.find(i => i.id === editId) : null;
  const rec = clean({
    id: old ? old.id : undefined,
    t: $('#i-t').value, url, nota: $('#i-nota').value,
    origen: (document.querySelector('input[name=origen]:checked') || {}).value,
    autor: $('#i-autor').value,
    disc: [...document.querySelectorAll('input[name=disc]:checked')].map(x => x.value),
    tipo: $('#i-tipo').value,
    tags: $('#i-tags').value.split(',').map(s => s.replace(/^#/, '').trim()),
    estado: $('#i-visto').checked ? 'visto' : 'por ver',
    fijado: $('#i-fijado').checked,
    img: formImg,
    fecha: old ? old.fecha : today(),
    mod: Date.now()
  });
  if (!rec) return show('Pon un título o un enlace.');
  if (old) items = items.map(i => i.id === old.id ? rec : i); else items = [rec, ...items];
  $('#dlg').close();
  refresh(); persist();
  toast(old ? 'Cambios guardados' : 'Guardado');
}
let delArmed = false, delTimer = null, lastDeleted = null;
function deleteItem(){
  const i = items.find(x => x.id === editId); if (!i) return;
  items = items.filter(x => x.id !== editId); lastDeleted = i;
  $('#dlg').close(); refresh(); persist();
  toast('Borrado: ' + i.t.slice(0, 40), 'Deshacer', () => { if (lastDeleted){ items = [lastDeleted, ...items]; lastDeleted = null; refresh(); persist(); } });
}

/* ===== Copia de seguridad ===== */
function backupJson(withImg){ return JSON.stringify({recursos:1, items: withImg ? items : items.map(i => Object.assign({}, i, {img: ''}))}, null, 1); }
function openBackup(){
  const dlg = $('#dlg');
  dlg.innerHTML = `<div class="dlg"><h2 id="dlg-title">Copia de seguridad</h2>
    <p class="muted">Copia este texto para guardarlo, o pega aquí una copia anterior y pulsa Importar. Importar suma lo que falta y no borra nada.</p>
    <label class="sr-only" for="b-json">Contenido de la copia</label>
    <label class="check" for="b-img"><input type="checkbox" id="b-img"> Incluir las fotos (el texto será mucho más largo)</label>
    <textarea class="json" id="b-json" spellcheck="false">${esc(backupJson(false))}</textarea>
    <p class="err" id="b-err" role="alert" hidden></p>
    <div class="dlg-acts"><div><button type="button" class="btn-ghost" id="b-copy">Copiar</button><button type="button" class="btn" id="b-import" ${readOnly ? 'disabled' : ''}>Importar lo pegado</button></div>
      <div><button type="button" class="btn-ghost" data-dclose>Cerrar</button></div></div></div>`;
  if (!dlg.open) dlg.showModal();
}
function importJson(){
  const err = $('#b-err');
  try {
    const raw = JSON.parse($('#b-json').value);
    const list = Array.isArray(raw) ? raw : raw.items;
    if (!Array.isArray(list)) throw new Error('x');
    let added = 0, updated = 0;
    list.map(clean).filter(Boolean).forEach(r => {
      const k = items.findIndex(i => i.id === r.id);
      if (k < 0){ items.push(r); added++; }
      else if (r.mod > items[k].mod){ items[k] = r; updated++; }
    });
    $('#dlg').close(); render(false); persist();
    toast(`Importados ${added} nuevos y ${updated} actualizados`);
  } catch (e) { err.textContent = 'No he podido leer ese texto. Pega la copia completa, tal como se copió.'; err.hidden = false; }
}

/* ===== Aviso ===== */
let toastTimer = null;
function toast(msg, label, fn){
  const r = $('#toast-root');
  r.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${fn ? `<button type="button" id="toast-act">${esc(label)}</button>` : ''}</div>`;
  if (fn) $('#toast-act').addEventListener('click', () => { fn(); r.innerHTML = ''; });
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, fn ? 7000 : 2600);
}

/* ===== Eventos ===== */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#add-btn') || t.closest('[data-open-add]')){
    const preset = {}; const r = currentRoute();
    if (DISC[r]) preset.disc = [r];
    openForm(null, preset); return;
  }
  if (t.closest('#backup-btn') || t.closest('#empty-backup')){ openBackup(); return; }
  if (t.closest('#menu-btn')){ const n = $('#nav-links'); const o = n.classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded', String(o)); return; }
  if (t.closest('[data-dclose]')){ $('#dlg').close(); return; }
  if (t.id === 'dlg'){ $('#dlg').close(); return; }
  if (t.closest('#i-del')){
    const b = $('#i-del');
    if (!delArmed){ delArmed = true; b.textContent = '¿Seguro? Pulsa otra vez'; clearTimeout(delTimer); delTimer = setTimeout(() => { delArmed = false; if (b.isConnected) b.textContent = 'Borrar'; }, 4000); }
    else { delArmed = false; deleteItem(); }
    return;
  }
  if (t.closest('#ph-del')){ formImg = ''; renderPhoto(); return; }
  if (t.closest('#b-copy')){
    const ta = $('#b-json');
    ta.select();
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(ta.value) : Promise.reject()).then(() => toast('Copiado'), () => toast('Selecciónalo y cópialo a mano'));
    return;
  }
  if (t.closest('#b-import')){ importJson(); return; }
  const pr = t.closest('[data-preset]');
  if (pr){ F = Object.assign(F0(), JSON.parse(pr.dataset.preset)); keepF = location.hash !== '#todo'; if (location.hash === '#todo') render(true); else location.hash = '#todo'; return; }
  const fb = t.closest('[data-fk]');
  if (fb){ F[fb.dataset.fk] = fb.dataset.fv; updateLista(); return; }
  if (t.closest('[data-clear]')){ const d = DISC[currentRoute()] ? currentRoute() : 'todo'; F = F0(); F.disc = d; updateLista(); return; }
  const a = t.closest('[data-act]');
  if (a && !readOnly){
    const id = a.dataset.id, act = a.dataset.act, i = items.find(x => x.id === id); if (!i) return;
    if (act === 'editar'){ openForm(id); return; }
    if (act === 'fijar') i.fijado = !i.fijado;
    if (act === 'visto') i.estado = i.estado === 'visto' ? 'por ver' : 'visto';
    i.mod = Date.now();
    refresh(); persist();
    const again = document.querySelector(`[data-act="${act}"][data-id="${CSS.escape(id)}"]`); if (again) again.focus();
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'i-foto'){ const f = e.target.files && e.target.files[0]; if (f) setPhoto(f); e.target.value = ''; }
  if (e.target.id === 'b-img') $('#b-json').value = backupJson(e.target.checked);
});
document.addEventListener('paste', e => {
  if (!$('#f-item')) return;
  const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => /^image\//.test(x.type));
  if (f){ e.preventDefault(); setPhoto(f); }
});
document.addEventListener('dragover', e => { if ($('#f-item') && e.dataTransfer && [...e.dataTransfer.types].includes('Files')){ e.preventDefault(); $('#dlg').classList.add('drop'); } });
document.addEventListener('dragleave', e => { if (e.target.id === 'dlg') $('#dlg').classList.remove('drop'); });
document.addEventListener('drop', e => {
  if (!$('#f-item')) return;
  $('#dlg').classList.remove('drop');
  const f = e.dataTransfer && [...e.dataTransfer.files].find(x => /^image\//.test(x.type));
  if (f){ e.preventDefault(); setPhoto(f); }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ F.q = e.target.value; updateLista(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'f-tipo'){ F.tipo = e.target.value; updateLista(); }
  if (e.target.id === 'f-fij'){ F.fijados = e.target.checked; updateLista(); }
});
document.addEventListener('submit', e => { if (e.target.id === 'f-item'){ e.preventDefault(); saveForm(); } });

/* ===== Arranque ===== */
if (DISC[currentRoute()]) F.disc = currentRoute();
noteSave(); render(false); Cloud.start();
</script>

</body></html>
